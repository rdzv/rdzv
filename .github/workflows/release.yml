name: Build and release
on:
  push:
    branches: [main]
    paths: ['src/**', 'packaging/**', 'tools/**', 'tests/**', 'requirements.lock', 'pyproject.toml', '.github/workflows/**']
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Check upstream dependencies before building
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'rdzv/rdzv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    outputs:
      build: ${{ steps.inputs.outputs.build }}
      commit: ${{ steps.inputs.outputs.commit }}
      release: ${{ steps.inputs.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refresh dependency inputs
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          python -m pip install pip-tools==7.5.1
          python -m tools.update
      - name: Record exact build inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          GIT_AUTHOR_NAME: Rendezvous
          GIT_AUTHOR_EMAIL: builds@users.noreply.github.com
          GIT_COMMITTER_NAME: Rendezvous
          GIT_COMMITTER_EMAIL: builds@users.noreply.github.com
        run: |
          BUILD=true
          if ! git diff --quiet -- requirements.lock packaging/inputs.json; then
            git add requirements.lock packaging/inputs.json
            git commit -m 'Refresh runtime dependencies'
            gh auth setup-git
            git push https://github.com/rdzv/rdzv.git HEAD:main
            # Start a fresh event at the new commit so build provenance identifies
            # the updated inputs rather than the schedule's original commit.
            gh workflow run release.yml --repo rdzv/rdzv --ref main
            BUILD=false
          elif [ "$EVENT" = schedule ]; then
            CURRENT=$(python -m tools.current)
            if [ "$CURRENT" = true ]; then BUILD=false; fi
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python -c 'import os,tomllib; print("release="+tomllib.load(open("pyproject.toml","rb"))["project"]["version"]+"-build."+os.environ["RUN_NUMBER"])' >> "$GITHUB_OUTPUT"
  check:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'pytest>=8,<9' 'pytest-asyncio>=1,<2' pyte==0.8.2 semgrep==1.156.0
          python -m pytest -q
          semgrep --config p/python --config p/security-audit --error --metrics=off --exclude tests .
  build:
    needs: [prepare, check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: armv7l
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Enable ARMv7 execution
        if: matrix.arch == 'armv7l'
        run: python -c 'import json,subprocess; image=json.load(open("packaging/inputs.json"))["binfmt"]; subprocess.run(["docker","run","--privileged","--rm",image,"--install","arm"],check=True)'
      - name: Build pinned runtime
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE: ${{ needs.prepare.outputs.release }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python -m tools.build --arch "$ARCH" --release "$RELEASE"
      - name: Verify rootless installation and real sessions
        env:
          ARCH: ${{ matrix.arch }}
        run: python -m tools.verify --arch "$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-*
          path: dist/incoming
          merge-multiple: true
      - run: python -m tools.assemble
      - name: Include exact source snapshot
        run: |
          git archive --format=tar.gz --output=dist/release/rdzv-source.tar.gz HEAD
          sha256sum dist/release/rdzv-source.tar.gz | sed 's|dist/release/||' >> dist/release/SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/release/*
      - name: Publish verified release and bootstrap scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.publish
