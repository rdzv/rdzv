[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rendezvous-shell"
version = "0.2.8"
description = "Single-use shell sessions over authenticated Tor onion services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["asyncssh>=2.21,<3", "cryptography>=45"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "pyte==0.8.2"]

[project.scripts]
rdzv = "rendezvous:main"
rendezvous = "rendezvous:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["rendezvous", "agent_session"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
